apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oumma.fullname" . }}-secrets
  labels:
    {{- include "oumma.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-password: {{ .Values.database.password | quote }}
  keycloak-client-secret: {{ .Values.keycloak.clientSecret | quote }}
  keycloak-admin-client-secret: {{ .Values.keycloak.adminClientSecret | quote }}
  llm-api-key: {{ .Values.llm.apiKey | quote }}
  llm-designer-api-key: {{ .Values.llm.designerApiKey | default .Values.llm.apiKey | quote }}
  smtp-password: {{ .Values.smtp.password | quote }}
